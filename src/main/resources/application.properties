# Application
spring.application.name=recipe-search-backend
server.port=8080

# Logging
debug=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.nelani=INFO

# --- JWT Security Configuration ---
# Move secret key and expiration to environment variables
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=86400000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://ai-recipe-generator-5rbk.onrender.com/login/oauth2/code/google

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=https://ai-recipe-generator-5rbk.onrender.com/login/oauth2/code/github

# Database Config
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Prepared Statement Cache
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# External API Keys
HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
UNSPLASH_API_KEY=${UNSPLASH_API_KEY}

# Management & Docs
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always
